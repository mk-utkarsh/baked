<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Half-Baked Cookies</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; color: #222; }
  h1 { font-size: 1.6em; }
  input[type=text] { width: 100%; padding: 8px; font-size: 1em; box-sizing: border-box; }
  button { margin-top: 12px; padding: 8px 16px; font-size: 1em; cursor: pointer; }
  code { background: #f2f2f2; padding: 2px 5px; border-radius: 3px; }
  .hint { color: #666; font-size: 0.9em; margin-top: 24px; }
</style>
</head>
<body>
  <h1>🍪 Half-Baked Cookies</h1>
  <p>Register an account below. You'll get a signed session cookie back.
     Somewhere on this site is an <code>/admin</code> page. Good luck.</p>

  <form action="/register" method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="e.g. bob" required />
    <button type="submit">Register</button>
  </form>

  <p class="hint">
    Source code for the auth routes is available on request from the challenge organizers.
  </p>
</body>
</html>
